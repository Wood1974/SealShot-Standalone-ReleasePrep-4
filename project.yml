name: SealShot
options:
  bundleIdPrefix: com.sealshot
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  SealShot:
    type: application
    platform: iOS
    sources:
      - path: SealShotApp
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sealshot.standalone
        GENERATE_INFOPLIST_FILE: 'NO'
        INFOPLIST_FILE: SealShotApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ''
    info:
      path: SealShotApp/Resources/Info.plist
